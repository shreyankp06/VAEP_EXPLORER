kind = "web"
previewPath = "/"
title = "VAEP Explorer"
description = "An interactive football analytics dashboard for exploring VAEP (Valuing Actions by Estimating Probabilities) data. Lets users replay action sequences on an animated pitch, browse player VAEP leaderboards, compare quality vs quantity in a scatter plot, and understand why different actions have different values."
version = "1.0.0"
id = "artifacts/vaep-explorer"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21625

[services.development]
run = "pnpm --filter @workspace/vaep-explorer run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/vaep-explorer", "run", "build" ]
serve = "static"
publicDir = "artifacts/vaep-explorer/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21625"
BASE_PATH = "/"
